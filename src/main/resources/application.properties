spring.application.name=pythoncito

# Configuracion de base de datos SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pythoncito_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
